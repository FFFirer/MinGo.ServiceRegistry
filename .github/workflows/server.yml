name: Server CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default; jobs that push images or create releases elevate below.
permissions:
  contents: read

# Cancel superseded runs on the same ref (branch/PR); tag pushes get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Container image destination. Defaults to GHCR; override with repository variables to push
  # elsewhere (e.g. Docker Hub). For a custom registry also set REGISTRY_USERNAME (variable) and
  # REGISTRY_PASSWORD (secret); when they are empty the job falls back to github.actor/GITHUB_TOKEN.
  # NOTE: GHCR requires a lowercase image path.
  REGISTRY_HOST: "${{ vars.REGISTRY_HOST || 'ghcr.io' }}"
  IMAGE_NAME: "${{ vars.IMAGE_NAME || format('{0}/service-registry', github.repository_owner) }}"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      # MinGo.ServiceRegistry.Abstractions is published on nuget.org (pinned in
      # Directory.Packages.props) and restored from the nuget.org source in nuget.config.
      - name: Restore
        run: dotnet restore ServiceRegistry.Server.slnx

      - name: Build
        run: dotnet build ServiceRegistry.Server.slnx -c "$CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test ServiceRegistry.Server.slnx -c "$CONFIGURATION" --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: "${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Skipped for pull requests (forks cannot push, and we only build to validate there).
      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: "${{ env.REGISTRY_HOST }}"
          username: "${{ vars.REGISTRY_USERNAME || github.actor }}"
          password: "${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
