name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # MinGo.ServiceRegistry.Abstractions is consumed as a NuGet package. By default it is
      # restored from nuget.org (already listed in nuget.config). Set the ABSTRACTIONS_NUGET_URL
      # repository variable to restore it from a private GitHub Packages feed instead.
      - name: Add private Abstractions feed
        if: "${{ vars.ABSTRACTIONS_NUGET_URL != '' }}"
        run: |
          dotnet nuget add source "${{ vars.ABSTRACTIONS_NUGET_URL }}" \
            --name abstractions \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore ServiceRegistry.Server.slnx

      - name: Build
        run: dotnet build ServiceRegistry.Server.slnx -c "$CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test ServiceRegistry.Server.slnx -c "$CONFIGURATION" --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -f deploy/docker/Dockerfile \
            -t "mingo/service-registry:${{ github.sha }}" \
            -t mingo/service-registry:latest \
            .
